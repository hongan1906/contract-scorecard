[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractscore"
version = "0.1.0"
description = "Synthetic supplier contracts + order history, contract term extraction, and contract-aware supplier scorecards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "reportlab", "pypdf"]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractscore = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
